[package]
name = "shbt-fabrication-hil"
description = "Real-time hardware-in-the-loop telemetry ingestion and residual monitoring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "shbt_cf_native"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
shbt-core-math = { path = "../shbt-core-math" }
shbt-fea-structural = { path = "../shbt-fea-structural" }
shbt-metrology-gum = { path = "../shbt-metrology-gum" }
shbt-rcwa-optics = { path = "../shbt-rcwa-optics" }
shbt-dielectric-floquet = { path = "../shbt-dielectric-floquet" }
rug = { workspace = true }
ndarray = "0.16"
num-complex = "0.4"
libc = "0.2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync"] }
pyo3 = { version = "0.25", optional = true, features = ["extension-module", "abi3-py310"] }
numpy = { version = "0.25", optional = true }

[features]
python = ["dep:pyo3", "dep:numpy"]

[lints]
workspace = true
