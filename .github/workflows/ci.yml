name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Runners are heterogeneous; pin the ISA so `cargo check` output is stable while
  # keeping every other flag from .cargo/config.toml (strict IEEE 754, opt-level=3).
  CARGO_BUILD_RUSTFLAGS: >-
    -C target-cpu=x86-64-v3
    -C opt-level=3
    -C llvm-args=-enable-no-nans-fp-math=false
    -C llvm-args=-enable-no-signed-zeros-fp-math=false

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GMP/MPFR build prerequisites for `rug`
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends m4 libgmp-dev libmpfr-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GMP/MPFR build prerequisites for `rug`
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends m4 libgmp-dev libmpfr-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GMP/MPFR build prerequisites for `rug`
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends m4 libgmp-dev libmpfr-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  bitwise:
    name: bitwise regression (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: x86_64-avx512 }
          - { os: ubuntu-24.04-arm, name: arm64-neon }
    steps:
      - uses: actions/checkout@v4
      - name: GMP/MPFR build prerequisites for `rug`
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends m4 libgmp-dev libmpfr-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Bitwise kernel digest must match the golden value on both ISAs
        run: cargo test -p shbt-fabrication-hil --test bitwise_regression --locked

  dep-graph:
    name: cyclic dependency validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Validate workspace topology is a DAG matching the spec
        run: python3 scripts/check_dep_graph.py
      - name: Python wrapper self-test
        run: python3 -m unittest discover -s python -v
