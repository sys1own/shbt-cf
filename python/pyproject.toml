[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "shbt-cf"
version = "0.1.0"
description = "Python orchestration wrapper for the SHBT zero-drift precision simulator Rust workspace"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["cffi", "numpy", "scipy"]

[project.scripts]
shbt-cf = "shbt_cf.__main__:main"

[tool.maturin]
manifest-path = "../crates/shbt-fabrication-hil/Cargo.toml"
python-packages = ["shbt_cf"]
features = ["python"]