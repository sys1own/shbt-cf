[package]
name = "shbt-cf"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
repository = "https://github.com/sys1own/shbt-cf"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "shbt_cf"
path = "src/main.rs"

[workspace]
resolver = "2"
members = [
    "crates/shbt-core-math",
    "crates/shbt-dielectric-floquet",
    "crates/shbt-rcwa-optics",
    "crates/shbt-fea-structural",
    "crates/shbt-metrology-gum",
    "crates/shbt-fabrication-hil",
    "crates/shbt-rcwa",
    "crates/shbt-contact",
    "crates/shbt-py-bindings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
repository = "https://github.com/sys1own/shbt-cf"
publish = false

[workspace.dependencies]
shbt-core-math = { path = "crates/shbt-core-math", version = "0.1.0" }
shbt-dielectric-floquet = { path = "crates/shbt-dielectric-floquet", version = "0.1.0" }
shbt-rcwa-optics = { path = "crates/shbt-rcwa-optics", version = "0.1.0" }
shbt-fea-structural = { path = "crates/shbt-fea-structural", version = "0.1.0" }
shbt-metrology-gum = { path = "crates/shbt-metrology-gum", version = "0.1.0" }
shbt-rcwa = { path = "crates/shbt-rcwa", version = "0.1.0" }
shbt-contact = { path = "crates/shbt-contact", version = "0.1.0" }
ndarray = "0.16"
ndarray-linalg = { version = "0.17", default-features = false, features = ["openblas-static"] }
num-complex = "0.4"
openblas-src = { version = "0.10", default-features = false, features = ["cblas", "rustls", "static"] }
rayon = "1.10"
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"] }
rug = { version = "1.27", default-features = false, features = ["float"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
panic = "abort"

[profile.dev]
opt-level = 1
