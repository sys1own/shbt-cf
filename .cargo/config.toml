# Target lockdown for the zero-drift numerical core (simulator_spec.pdf §1, Stage 1).
#
# * `-C target-cpu=native` / `-C opt-level=3`: full SIMD width and optimisation on the
#   build host.
# * Strict IEEE 754-2019 semantics are guaranteed by rustc itself: it never enables
#   fast-math, so NaN and signed-zero handling cannot be assumed away.  Contraction
#   (FMA) is left at the LLVM default of "off" and must only be introduced through
#   explicit `mul_add` intrinsics.  (The former `-C llvm-args=-enable-no-nans/…`
#   belt-and-suspenders flags were removed in LLVM 20 / rustc ≥1.87.)
[build]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "opt-level=3",
]

[term]
color = "auto"
